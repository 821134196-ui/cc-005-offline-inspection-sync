server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache the service worker / manifest so updates roll out instantly.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API + health checks are proxied to the Go backend on the compose network.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Photo part uploads can be large; do not buffer them.
        client_max_body_size 20m;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }
    location = /healthz {
        proxy_pass http://backend:8080/healthz;
    }

    # SPA fallback (service worker handles offline navigation too).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
